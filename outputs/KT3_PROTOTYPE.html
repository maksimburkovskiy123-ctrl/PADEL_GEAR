<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padel Match — прототип</title>
  <style>
    :root{--ink:#17231f;--muted:#6c7772;--line:#d9e2dc;--paper:#f7faf7;--card:#fff;--green:#1d6b55;--lime:#d9f36b;--soft:#edf5ef;--orange:#f1a15b;--shadow:0 18px 50px rgba(25,55,43,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:auto;padding:0 28px 56px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;font-size:19px}.brand-mark{width:30px;height:30px;border-radius:9px 9px 14px 9px;background:var(--lime);display:grid;place-items:center;color:var(--green);font-size:13px}.nav{display:flex;gap:8px;align-items:center}.nav button,.link-button{background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:var(--soft);color:var(--green)}.compare-count{background:var(--green);color:#fff;border-radius:99px;padding:2px 7px;font-size:11px;margin-left:4px}.view{padding-top:46px}.eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:11px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;min-height:430px}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.98;letter-spacing:-.07em;margin:16px 0 24px;max-width:700px}.hero p{color:var(--muted);font-size:18px;max-width:550px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.primary,.secondary{padding:13px 18px;border-radius:12px;font-weight:750}.primary{background:var(--green);color:white}.primary:hover{background:#154f40}.secondary{background:var(--lime);color:var(--ink)}.ghost{background:transparent;color:var(--green);padding:10px 0;font-weight:700}.hero-art{min-height:340px;border-radius:32px;background:var(--green);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}.hero-art:before{content:"";position:absolute;width:250px;height:390px;border:2px solid rgba(255,255,255,.32);border-radius:52% 48% 48% 52%;transform:rotate(28deg)}.hero-art:after{content:"MATCH YOUR GAME";position:absolute;bottom:24px;left:28px;color:var(--lime);font-weight:900;letter-spacing:.17em;font-size:12px}.racket-shape{width:142px;height:210px;border-radius:50% 50% 43% 43%;background:var(--lime);transform:rotate(28deg);position:relative;box-shadow:17px 20px 0 -8px #b8d24e}.racket-shape:after{content:"";position:absolute;width:13px;height:105px;background:#d6dfbd;bottom:-85px;left:65px;border-radius:8px;transform:rotate(-1deg)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.section-head h2{font-size:36px;letter-spacing:-.06em;margin:6px 0}.muted{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:42px}.step,.panel,.model-card,.result-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.step-num{color:var(--green);font-weight:900;font-size:12px}.step h3{margin:20px 0 7px}.toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.model-card{padding:0;overflow:hidden}.model-visual{height:158px;background:var(--soft);display:grid;place-items:center;position:relative}.model-visual span{width:70px;height:100px;border-radius:50%;background:var(--green);display:block;transform:rotate(24deg);box-shadow:9px 13px 0 -5px #c8d1c8}.model-visual.orange{background:#fff1e5}.model-visual.orange span{background:var(--orange)}.model-visual.blue{background:#e9f0f7}.model-visual.blue span{background:#6c96b6}.model-body{padding:17px}.model-body h3{margin:5px 0;font-size:18px}.tag{display:inline-flex;background:var(--soft);color:var(--green);padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.model-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 0}.card-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.details{color:var(--green);font-weight:800;background:transparent}.compare-toggle{background:var(--ink);color:#fff;border-radius:9px;padding:9px 11px;font-size:12px}.compare-toggle.selected{background:var(--green)}.back{background:transparent;color:var(--green);font-weight:800;padding:0;margin-bottom:18px}.detail-layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px}.detail-visual{min-height:420px;border-radius:24px;background:var(--soft);display:grid;place-items:center}.detail-visual span{width:150px;height:230px;border-radius:50%;background:var(--green);display:block;transform:rotate(24deg);box-shadow:18px 25px 0 -10px #c8d1c8}.detail-copy h1{font-size:48px;line-height:1;letter-spacing:-.06em;margin:10px 0 18px}.spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.spec{border:1px solid var(--line);border-radius:12px;padding:13px}.spec b{display:block;font-size:18px}.spec small{color:var(--muted)}.source{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px;margin-top:24px}.empty{text-align:center;padding:70px 20px}.compare-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.compare-table th,.compare-table td{text-align:left;padding:16px;border-bottom:1px solid var(--line)}.compare-table th{background:var(--soft);color:var(--green);font-size:13px}.survey-wrap{max-width:730px;margin:auto}.progress{height:8px;background:var(--line);border-radius:99px;margin:20px 0 32px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .2s}.question{font-size:36px;line-height:1.05;letter-spacing:-.05em;margin:0 0 22px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{background:#fff;border:1px solid var(--line);padding:18px;border-radius:14px;text-align:left}.choice:hover,.choice.active{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,107,85,.1)}.choice strong{display:block}.survey-actions{display:flex;justify-content:space-between;margin-top:28px}.results-grid{display:grid;gap:14px}.result-card{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.rank{font-size:30px;color:var(--green);font-weight:900}.result-card h3{margin:0 0 5px}.reasons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.reason{background:var(--soft);color:var(--green);font-size:12px;padding:5px 8px;border-radius:99px}.score{font-size:26px;font-weight:900;color:var(--green)}.score small{font-size:11px;color:var(--muted);font-weight:500}.notice{background:#fff7e8;border:1px solid #f4d8a5;border-radius:12px;padding:13px;color:#785625;font-size:13px;margin-bottom:20px}@media(max-width:800px){.shell{padding:0 17px 40px}.topbar{height:auto;min-height:70px;align-items:flex-start;padding:16px 0;gap:12px}.nav{flex-wrap:wrap;justify-content:flex-end}.nav button{padding:7px}.hero,.detail-layout{grid-template-columns:1fr}.hero{padding-top:20px}.hero-art{min-height:260px;order:-1}.steps,.model-grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.detail-copy h1{font-size:40px}.spec-grid{grid-template-columns:repeat(2,1fr)}.result-card{grid-template-columns:auto 1fr}.result-card .primary{grid-column:2}.score{grid-column:2;grid-row:1}.choices{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const models = [
      {id:1,name:"Демо-модель A",kind:"Контроль",tone:"",level:"Начальный",weight:"360 г",balance:"Низкий",shape:"Круглая",score:94,reasons:["подходит для начала","легче контролировать","маневренная"]},
      {id:2,name:"Демо-модель B",kind:"Универсальная",tone:"orange",level:"Средний",weight:"370 г",balance:"Средний",shape:"Капля",score:91,reasons:["баланс контроля и мощности","универсальный вариант","средний вес"]},
      {id:3,name:"Демо-модель C",kind:"Мощность",tone:"blue",level:"Средний",weight:"380 г",balance:"Высокий",shape:"Алмазная",score:86,reasons:["акцент на атаке","высокий баланс","для активной игры"]}
    ];
    const survey = [
      {key:"level",title:"Какой у вас уровень игры?",items:["Начинающий","Средний","Продвинутый"]},
      {key:"style",title:"Что ближе вашему стилю?",items:["Контроль","Универсальная игра","Атака"]},
      {key:"priority",title:"Что важнее при выборе?",items:["Маневренность","Баланс","Мощность"]}
    ];
    const state={view:"home",filter:"Все",selected:[],detail:null,step:0,answers:{}};
    const app=document.getElementById("app");
    function setView(view){state.view=view;render();scrollTo(0,0)}
    function selected(id){return state.selected.includes(id)}
    function toggleCompare(id){if(selected(id)){state.selected=state.selected.filter(x=>x!==id)}else if(state.selected.length<3){state.selected.push(id)}render()}
    function openDetail(id){state.detail=id;setView("detail")}
    function filterCatalog(value){state.filter=value;render()}
    function modelCard(m){return `<article class="model-card"><div class="model-visual ${m.tone}"><span></span></div><div class="model-body"><span class="tag">${m.kind}</span><h3>${m.name}</h3><p class="muted">Демонстрационная карточка прототипа</p><div class="model-meta"><span>${m.weight}</span><span>${m.balance}</span></div><div class="card-actions"><button class="details" onclick="openDetail(${m.id})">Подробнее</button><button class="compare-toggle ${selected(m.id)?"selected":""}" onclick="toggleCompare(${m.id})">${selected(m.id)?"В сравнении":"Сравнить"}</button></div></div></article>`}
    function header(){return `<header class="topbar"><button class="brand" onclick="setView('home')"><span class="brand-mark">PM</span>padel match</button><nav class="nav"><button class="${state.view==='home'?'active':''}" onclick="setView('home')">Главная</button><button class="${state.view==='catalog'?'active':''}" onclick="setView('catalog')">Каталог</button><button class="${state.view==='survey'||state.view==='results'?'active':''}" onclick="setView('survey')">Подбор</button><button onclick="setView('compare')">Сравнение <span class="compare-count">${state.selected.length}</span></button></nav></header>`}
    function home(){return `<section class="view"><div class="hero"><div><span class="eyebrow">Подбор ракетки без лишних догадок</span><h1>Ракетка, которая подходит вашей игре.</h1><p>Сначала разберитесь в своих предпочтениях. Затем сравните модели и получите понятную рекомендацию.</p><div class="actions"><button class="primary" onclick="setView('survey')">Пройти подбор</button><button class="secondary" onclick="setView('catalog')">Открыть каталог</button></div></div><div class="hero-art"><span class="racket-shape"></span></div></div><div class="steps"><article class="step"><span class="step-num">01 / АНКЕТА</span><h3>Опишите свою игру</h3><p class="muted">Уровень, стиль и то, что важнее в ракетке.</p></article><article class="step"><span class="step-num">02 / СРАВНЕНИЕ</span><h3>Посмотрите разницу</h3><p class="muted">Сопоставьте две или три модели рядом.</p></article><article class="step"><span class="step-num">03 / ВЫБОР</span><h3>Поймите рекомендацию</h3><p class="muted">Каждый результат сопровождается причинами.</p></article></div></section>`}
    function catalog(){let list=state.filter==='Все'?models:models.filter(m=>m.kind===state.filter);return `<section class="view"><div class="section-head"><div><span class="eyebrow">Демонстрационный каталог</span><h2>Найдите свою модель</h2><p class="muted">В прототипе используются условные карточки.</p></div><button class="secondary" onclick="setView('survey')">Подобрать по анкете</button></div><div class="toolbar"><div class="filters"><select onchange="filterCatalog(this.value)"><option>Все</option><option ${state.filter==='Контроль'?'selected':''}>Контроль</option><option ${state.filter==='Универсальная'?'selected':''}>Универсальная</option><option ${state.filter==='Мощность'?'selected':''}>Мощность</option></select><select><option>Любой уровень</option><option>Начальный</option><option>Средний</option></select></div><button class="ghost" onclick="setView('compare')">Сравнение (${state.selected.length}/3) →</button></div><div class="model-grid">${list.map(modelCard).join('')}</div></section>`}
    function detail(){let m=models.find(x=>x.id===state.detail)||models[0];return `<section class="view"><button class="back" onclick="setView('catalog')">← Вернуться в каталог</button><div class="detail-layout"><div class="detail-visual"><span></span></div><div class="detail-copy"><span class="tag">${m.kind}</span><h1>${m.name}</h1><p class="muted">Демонстрационная карточка. Реальные значения будут добавлены после проверки официальных источников.</p><div class="spec-grid"><div class="spec"><small>Уровень</small><b>${m.level}</b></div><div class="spec"><small>Вес</small><b>${m.weight}</b></div><div class="spec"><small>Баланс</small><b>${m.balance}</b></div><div class="spec"><small>Форма</small><b>${m.shape}</b></div><div class="spec"><small>Цена</small><b>уточняется</b></div><div class="spec"><small>Источник</small><b>не добавлен</b></div></div><button class="primary" onclick="toggleCompare(${m.id})">${selected(m.id)?"Убрать из сравнения":"Добавить к сравнению"}</button><p class="source">Источник характеристик появится после наполнения базы проверенными данными.</p></div></div></section>`}
    function compare(){let list=models.filter(m=>selected(m.id));if(!list.length)return `<section class="view"><div class="empty"><span class="eyebrow">Сравнение</span><h2>Здесь пока нет моделей</h2><p class="muted">Выберите от двух до трех ракеток в каталоге.</p><button class="primary" onclick="setView('catalog')">Перейти в каталог</button></div></section>`;return `<section class="view"><div class="section-head"><div><span class="eyebrow">Сравнение</span><h2>Модели рядом</h2><p class="muted">Выбрано ${list.length} из 3. Для учебного прототипа.</p></div><button class="secondary" onclick="setView('catalog')">Добавить модель</button></div><div class="panel"><table class="compare-table"><thead><tr><th>Параметр</th>${list.map(m=>`<th>${m.name}</th>`).join('')}</tr></thead><tbody>${[['Назначение','kind'],['Уровень','level'],['Вес','weight'],['Баланс','balance'],['Форма','shape']].map(([label,key])=>`<tr><td>${label}</td>${list.map(m=>`<td>${m[key]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
    function answer(key,value){state.answers[key]=value;render()}
    function nextSurvey(){if(!state.answers[survey[state.step].key])return;if(state.step<survey.length-1){state.step++;render()}else setView('results')}
    function surveyView(){let q=survey[state.step],pct=((state.step+1)/survey.length)*100;return `<section class="view survey-wrap"><span class="eyebrow">Шаг ${state.step+1} из ${survey.length}</span><div class="progress"><i style="width:${pct}%"></i></div><h1 class="question">${q.title}</h1><div class="choices">${q.items.map(item=>`<button class="choice ${state.answers[q.key]===item?'active':''}" onclick="answer('${q.key}','${item}')"><strong>${item}</strong><span class="muted">Выбрать этот вариант</span></button>`).join('')}</div><div class="survey-actions">${state.step?'<button class="ghost" onclick="state.step--;render()">← Назад</button>':'<span></span>'}<button class="primary" onclick="nextSurvey()">${state.step===survey.length-1?'Показать результат':'Продолжить →'}</button></div></section>`}
    function results(){return `<section class="view"><div class="section-head"><div><span class="eyebrow">Ваш результат</span><h2>С чего начать выбор</h2><p class="muted">Результат демонстрирует логику объяснимой рекомендации.</p></div><button class="secondary" onclick="state.step=0;state.answers={};setView('survey')">Пройти заново</button></div><div class="notice">Это прототип: оценки и характеристики условные. В MVP они будут рассчитаны по проверенным данным из SQLite.</div><div class="results-grid">${models.slice().sort((a,b)=>b.score-a.score).map((m,i)=>`<article class="result-card"><div class="rank">0${i+1}</div><div><h3>${m.name}</h3><span class="tag">${m.kind}</span><div class="reasons">${m.reasons.map(r=>`<span class="reason">${r}</span>`).join('')}</div></div><div class="score">${m.score}<small>/ 100</small></div><button class="primary" onclick="openDetail(${m.id})">Открыть карточку</button></article>`).join('')}</div></section>`}
    function render(){let content=state.view==='home'?home():state.view==='catalog'?catalog():state.view==='detail'?detail():state.view==='compare'?compare():state.view==='survey'?surveyView():results();app.innerHTML=`<div class="shell">${header()}${content}</div>`}
    render();
  </script>
</body>
</html>
