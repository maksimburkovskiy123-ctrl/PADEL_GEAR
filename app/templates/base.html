<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Padel Match{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">PM</span>padel match</a>
      <nav class="nav">
        <a href="{{ url_for('home') }}">Главная</a>
        <a href="{{ url_for('catalog') }}">Каталог</a>
        <a href="{{ url_for('recommend_form') }}">Подбор</a>
        <a href="{{ url_for('compare') }}">Сравнение</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="footer">Padel Match · учебный MVP · цены ориентировочные</footer>
  </div>
</body>
</html>
